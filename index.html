<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="weatherForm">
        <input type="text" class="cityInput" placeholder="Enter city" required>
        <button type="submit">Get Weather</button>
    </form>

    <div class="card">
        <h2 class="cityName">Miami</h2>
        <p class="temperature">60</p>
        <p class="humidity">Humidity: 80%</p>
        <p class="description">Cloudy</p>
        <p class="weatherEmoji">☀️</p>
        <p class="errorDisplay">Please enter a city</p>

    </div>

    <script src="index.js"></script>
</body>
</html>
